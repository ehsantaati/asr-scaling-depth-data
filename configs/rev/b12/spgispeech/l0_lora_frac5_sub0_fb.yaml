# B12 spgispeech L0 LORA @ 0.05 data -- GENERATED by
# scripts/gen_campaign_configs.py; edit the cell table there, not this file.
model_id: "openai/whisper-medium"
language: "en"
task: "transcribe"

train_sets:
  - name: "spgispeech_2"
train_dataset_args:
  max_audio_duration_secs: 30

val_sets:
  - name: "spgispeech_2"
val_dataset_args:
  max_audio_duration_secs: 30
  max_samples: 256          # fixed deterministic probe; keeps eval <6% of run time

eval_sets:
  - name: "spgispeech_2"
eval_dataset_args:
  max_audio_duration_secs: 30
  max_samples: -1

ood_eval_sets:
  - name: "openslr-librispeech-asr-clean"
  - name: "openslr-librispeech-asr-other"
ood_eval_dataset_args:
  max_audio_duration_secs: 30
  max_samples: -1

data_fractions: [0.05]
num_subsets: 1
subset_index: 0

lora_config:
  r: 64
  lora_alpha: 128
  lora_dropout: 0.1
  init_blocks:
    - ["proj_out"]

target_modules:
  - "proj_out"

output_dir: "outputs/rev/b12/spgispeech/l0_lora_frac5_sub0_fb"
num_epochs: 0
batch_size: 16
grad_accum_steps: 1
learning_rate: 1e-5
warmup_ratio: 0.01
weight_decay: 0.0
fp16: true

data_seed: 42
data_order_seed_mode: "auto"
dataloader_num_workers: 8
strict_reproducibility: true

logging_steps: 25
eval_steps: 250
eval_on_start: true
eval_batch_size: 16

# Action B8 applies to deep full FT only: those are the configs argued to be
# "harder to optimize", so their ranking must be shown to survive checkpoint
# selection (R2-6c).
checkpoint_fraction: 0.0
run_best_vs_final: false
best_vs_final_max_samples: 2000

score_legacy_path: true
decode_num_beams: 1
decode_dtype: "fp16"
decode_force_language: true
save_mode: "auto"
log_dataset_metadata: false
