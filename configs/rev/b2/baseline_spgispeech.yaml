# B2 vanilla Whisper-Medium baseline on spgispeech -- inference only, no training.
# Gives the OOD and cost tables an un-adapted reference point (R1-2.1, R1-5.5, R3-10),
# which the original campaign only had for VoxPopuli and scored with the pre-fix path.
#
# The decode block below must stay byte-identical to the training configs' -- that is
# what makes "improvement over baseline" a meaningful subtraction. check_artifacts.sh
# --baseline-parity compares the two spec blocks for exactly this reason.
#
#   bash scripts/run_inf.sh configs/rev/b2/baseline_spgispeech.yaml 0
model_id: "openai/whisper-medium"
language: "en"
task: "transcribe"

eval_sets:
  - name: "spgispeech_2"
eval_dataset_args:
  max_audio_duration_secs: 30
  max_samples: -1

ood_eval_sets:
  - name: "openslr-librispeech-asr-clean"
  - name: "openslr-librispeech-asr-other"
ood_eval_dataset_args:
  max_audio_duration_secs: 30
  max_samples: -1

eval_batch_size: 16

# Must match the training configs exactly.
decode_num_beams: 1
decode_dtype: "fp16"
decode_force_language: true
score_legacy_path: true

use_fast_inference: true
num_inference_workers: 0
fp16: true

output_dir: "outputs/rev/b2/baseline_spgispeech"
