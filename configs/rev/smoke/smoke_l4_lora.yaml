# Smoke test: L4 LoRA on VoxPopuli-EN, deliberately small.
# Real model, real data, real code path -- only the sample counts are reduced, so a
# pass here means the campaign's artifact contract holds end to end.
# ~125 optimizer steps; ~15-25 min on one A6000.
#
#   bash scripts/queue_worker.sh jobs/smoke.jobs      (GPU=0)
#   bash scripts/check_artifacts.sh <run_dir>
model_id: "openai/whisper-medium"
language: "en"
task: "transcribe"

train_sets:
  - name: "voxpopuli-en"
    streaming: false
train_dataset_args:
  max_audio_duration_secs: 30
  max_samples: 2000

val_sets:
  - name: "voxpopuli-en"
    streaming: false
val_dataset_args:
  max_audio_duration_secs: 30
  max_samples: 64

eval_sets:
  - name: "voxpopuli-en"
    streaming: false
eval_dataset_args:
  max_audio_duration_secs: 30
  max_samples: 128

# Out-of-domain (action B7). Scored with the identical decode spec.
ood_eval_sets:
  - name: "openslr-librispeech-asr-clean"
    streaming: false
  - name: "openslr-librispeech-asr-other"
    streaming: false
ood_eval_dataset_args:
  max_audio_duration_secs: 30
  max_samples: 128

data_fractions: [1.0]
num_subsets: 1

lora_config:
  r: 64
  lora_alpha: 128
  lora_dropout: 0.1
  init_blocks:
