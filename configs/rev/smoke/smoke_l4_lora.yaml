output_dir: "outputs/rev/smoke/l4_lora"
num_epochs: 1
batch_size: 16
grad_accum_steps: 1
learning_rate: 1e-5
warmup_ratio: 0.01
weight_decay: 0.0
fp16: true

seed: 42
data_seed: 42
data_order_seed_mode: "auto"
dataloader_num_workers: 8      # forced to 0 by strict_reproducibility
strict_reproducibility: true

# Dense grids so a short run still produces a real curve.
logging_steps: 5
eval_steps: 25
eval_on_start: true
eval_batch_size: 16

# B8 exercised here even though it is a LoRA run, so the smoke test covers the
# checkpoint -> best-vs-final -> delete path that the deep full-FT jobs rely on.
checkpoint_fraction: 0.1
run_best_vs_final: true
best_vs_final_max_samples: 128

# Dual-path scoring: wer_fixed and wer_legacy for every eval set.
score_legacy_path: true
decode_num_beams: 1
decode_dtype: "fp16"
decode_force_language: true

save_mode: "auto"              # -> "adapter" for a LoRA run
log_dataset_metadata: false    # would iterate the whole stream just to count it
