# Debug config for spgispeech-s
model_id: "openai/whisper-tiny"
language: "en"
task: "transcribe"

# Use spgispeech-s by name
train_sets:
  - name: "spgispeech-s"

# Validation set (using dummy for speed, or spgispeech-s dev if available)
val_sets:
  - name: "dummy" 

# Data scaling
data_fractions: [1.0]
num_subsets: 1

# Training
output_dir: "outputs/spgispeech_debug"
num_epochs: 1
max_steps: 2 # Very short run
batch_size: 2
grad_accum_steps: 1
learning_rate: 1e-5
warmup_steps: 0
fp16: false
seed: 42

# Evaluation
do_eval: true
eval_steps: 100

# LoRA (optional, disable for this test)
# lora_config: ...
