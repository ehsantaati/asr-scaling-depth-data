# ==============================================================================
# Inference Template Configuration
# ==============================================================================

# Model and Task Configuration
model_id: "openai/whisper-medium"   # Path to pre-trained model, Hugging Face model ID, or fine-tuned checkpoint path
language: "en"                      # Target language for transcription
task: "transcribe"                  # Task to perform (e.g., "transcribe", "translate")

# ------------------------------------------------------------------------------
# Dataset Configuration for Inference
# ------------------------------------------------------------------------------
# Evaluation Sets to run inference on
eval_sets:
  - name: "voxpopuli-en"
    streaming: true                 # Set to true for streaming large datasets

# Arguments for the dataset
eval_dataset_args:
  max_samples: -1                   # Set a specific number to limit samples, -1 for all
  max_audio_duration_secs: 30       # Filter out audio longer than this (seconds)

# ------------------------------------------------------------------------------
# Inference Options
# ------------------------------------------------------------------------------
eval_batch_size: 16                 # Batch size per GPU for inference

use_fast_inference: true            # Enable optimizations for faster inference (e.g., Flash Attention)
num_inference_workers: 0            # Number of CPU workers for dataloading during inference (0 for main thread)
fp16: true                          # Use mixed precision (FP16) to speed up inference and save memory

# ------------------------------------------------------------------------------
# Output Configuration
# ------------------------------------------------------------------------------
output_dir: "outputs/"  # Directory to save predictions/metrics
