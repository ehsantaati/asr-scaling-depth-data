# ==============================================================================
# LoRA (Low-Rank Adaptation) Fine-Tuning Template Configuration
# ==============================================================================

# Model and Task Configuration
model_id: "openai/whisper-medium"   # Path to pre-trained model or Hugging Face model ID
language: "en"                      # Target language for transcription
task: "transcribe"                  # Task to perform (e.g., "transcribe", "translate")

# ------------------------------------------------------------------------------
# Dataset Configuration
# ------------------------------------------------------------------------------

# Training Sets
train_sets:
  - name: "speechcolab-gigaspeech-m"
    streaming: false                # Set to true for streaming large datasets

train_dataset_args:
  max_audio_duration_secs: 30       # Filter out audio longer than this (seconds)

# Validation Sets (Used during training for evaluation)
val_sets:
  - name: "speechcolab-gigaspeech-m"
    streaming: false

val_dataset_args:
  max_audio_duration_secs: 30
  max_samples: -1                   # Set a specific number to limit samples, -1 for all

# Evaluation Sets (Can be used for separate evaluation runs)
eval_sets:
  - name: "speechcolab-gigaspeech-m"
    streaming: false

eval_dataset_args:
  max_audio_duration_secs: 30
  max_samples: -1

# Data Scaling / Subsetting
data_fractions: [0.5]               # Fraction of data to use (e.g., 0.5 for 50%, 1.0 for 100%)
num_subsets: 1                      # Number of subsets to create for data fractioning

# ------------------------------------------------------------------------------
# LoRA Specific Options
# ------------------------------------------------------------------------------

lora_config:
  r: 64                  # Rank of the LoRA update matrices
  lora_alpha: 128        # Alpha scaling factor for LoRA
  lora_dropout: 0.1      # Dropout probability applied to LoRA layers
  # init_blocks specifies which blocks/layers to initialize LoRA adapters for
  init_blocks:
    - ["proj_out", "layers.23"]
    - ["layers.22"]
    - ["layers.21"]
    - ["layers.20"]
    - ["layers.19"]
    - ["layers.18"]
    - ["layers.17"]
    - ["layers.16"]
    - ["layers.15"]
    - ["layers.14"]
    - ["layers.13"]
    - ["layers.12"]
    - ["layers.11"]
    - ["layers.10"]
    - ["layers.9"]
    - ["layers.8"]
    - ["layers.7"]
    - ["layers.6"]
    - ["layers.5"]
    - ["layers.4"]
    - ["layers.3"]
    - ["layers.2"]
    - ["layers.1"]
    - ["layers.0"]

# Explicitly specify the modules to target for LoRA adaptation
# This gives fine-grained control over which projections receive adapters
target_modules:
  - "proj_out"
  - "model.decoder.layers.23.self_attn.q_proj"
  - "model.decoder.layers.23.self_attn.k_proj"
  - "model.decoder.layers.23.self_attn.v_proj"
  - "model.decoder.layers.23.self_attn.out_proj"
  - "model.decoder.layers.23.encoder_attn.q_proj"
  - "model.decoder.layers.23.encoder_attn.k_proj"
  - "model.decoder.layers.23.encoder_attn.v_proj"
  - "model.decoder.layers.23.encoder_attn.out_proj"
  - "model.decoder.layers.23.fc1"
  - "model.decoder.layers.23.fc2"
  - "model.decoder.layers.22.self_attn.q_proj"
  - "model.decoder.layers.22.self_attn.k_proj"
  - "model.decoder.layers.22.self_attn.v_proj"
  - "model.decoder.layers.22.self_attn.out_proj"
  - "model.decoder.layers.22.encoder_attn.q_proj"
  - "model.decoder.layers.22.encoder_attn.k_proj"
  - "model.decoder.layers.22.encoder_attn.v_proj"
  - "model.decoder.layers.22.encoder_attn.out_proj"
  - "model.decoder.layers.22.fc1"
  - "model.decoder.layers.22.fc2"
  # ... (Repeat the above block for layers 21 down to 1 if you want to explicitly target them)
  # NOTE: Include the appropriate layers depending on your model size and needs.
  - "model.decoder.layers.0.self_attn.q_proj"
  - "model.decoder.layers.0.self_attn.k_proj"
  - "model.decoder.layers.0.self_attn.v_proj"
  - "model.decoder.layers.0.self_attn.out_proj"
  - "model.decoder.layers.0.encoder_attn.q_proj"
  - "model.decoder.layers.0.encoder_attn.k_proj"
  - "model.decoder.layers.0.encoder_attn.v_proj"
  - "model.decoder.layers.0.encoder_attn.out_proj"
  - "model.decoder.layers.0.fc1"
  - "model.decoder.layers.0.fc2"

# ------------------------------------------------------------------------------
# Training Hyperparameters
# ------------------------------------------------------------------------------
output_dir: "outputs/"  # Directory to save model checkpoints and logs
num_epochs: 0                                           # Number of training epochs (0 means compute-matched: calculates steps based on FULL dataset size)

# Optimization
batch_size: 16                        # Batch size per GPU
grad_accum_steps: 1                   # Number of gradient accumulation steps
learning_rate: 1e-5                   # Learning rate (typically higher for LoRA)
warmup_ratio: 0.01                    # Warmup ratio for learning rate schedule

# Hardware and Reproducibility
fp16: true                            # Use mixed precision training
data_seed: 42                         # Seed for data reproducibility
dataloader_num_workers: 8             # Number of workers for data loading
strict_reproducibility: true          # Ensure reproducible results

# ------------------------------------------------------------------------------
# Evaluation Configuration
# ------------------------------------------------------------------------------
eval_steps: 1000                      # Evaluate every X steps
eval_batch_size: 16                   # Evaluation batch size per GPU
