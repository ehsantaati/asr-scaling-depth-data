# Fine-tuning config
model_id: "openai/whisper-medium"
language: "en"
task: "transcribe"

train_sets:
  - name: "mlcommons-peoples-speech-clean-sa"
  - name: "mlcommons-peoples-speech-dirty-sa"

train_dataset_args:
  max_audio_duration_secs: 30

val_sets:
  - name: "mlcommons-peoples-speech-validation"

val_dataset_args:
  max_audio_duration_secs: 30
  max_samples: -1

eval_sets:
  - name: "mlcommons-peoples-speech-test"

eval_dataset_args:
  max_samples: -1

# Data scaling
data_fractions: [1.0]
num_subsets: 1

target_modules:
  - "proj_out"
# Training
output_dir: "outputs/mlcommons-peoples-speech/001_s_1"
num_epochs: 1
batch_size: 16
grad_accum_steps: 1
learning_rate: 1e-5
warmup_steps: 500
fp16: true
seed: 42
dataloader_num_workers: 8

# Evaluation
do_eval: true
eval_steps: 1000
eval_batch_size: 16
