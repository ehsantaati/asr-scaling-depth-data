# Fine-tuning config 
model_id: "openai/whisper-medium"
language: "en"
task: "transcribe"

train_sets:
  - name: "spgispeech_2"
    streaming: false

train_dataset_args:
  max_audio_duration_secs: 30

val_sets:
  - name: "spgispeech_2"
    streaming: false

val_dataset_args:
  max_audio_duration_secs: 30
  max_samples: -1

eval_sets:
  - name: "spgispeech_2"
    streaming: false

eval_dataset_args:
  max_audio_duration_secs: 30
  max_samples: -1

# Data scaling
data_fractions: [0.05]
num_subsets: 5

# LoRA (optional, disable for this test)
lora_config:
  r: 64                  # Rank
  lora_alpha: 128        # Alpha scaling
  lora_dropout: 0.1     # Dropout probability

target_modules:
  - "proj_out"
# Training
output_dir: "outputs/spgispeech_2/002/0023/data_scaling_half_total_steps"
num_epochs: 0
batch_size: 16
grad_accum_steps: 1
learning_rate: 1e-5
warmup_ratio: 0.01
fp16: true
data_seed: 42
dataloader_num_workers: 8
strict_reproducibility: true

max_steps_fraction: 0.5
log_dataset_metadata: true
# Evaluation
eval_steps: 1000
eval_batch_size: 16
