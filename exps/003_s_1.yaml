# Fine-tuning config 
model_id: "openai/whisper-medium"
language: "en"
task: "transcribe"

train_sets:
  - name: "spgispeech-s"

val_sets:
  - name: "spgispeech-s"

eval_sets:
  - name: "spgispeech-s"

# eval_dataset_args:
#   max_samples: 2

# val_dataset_args:
#   max_samples: 2
# Data scaling
data_fractions: [1.0]
num_subsets: 1

target_modules:
  - "proj_out"
  - "model.decoder.layer_norm"
  - "model.decoder.layers.11"

# Training
output_dir: "outputs/003"
max_steps: 5000 
batch_size: 16
grad_accum_steps: 1
learning_rate: 1e-5
warmup_steps: 500
fp16: true
seed: 42

# Evaluation
do_eval: true
eval_steps: 1000
eval_batch_size: 16
# LoRA (optional, disable for this test)
# lora_config: ...
