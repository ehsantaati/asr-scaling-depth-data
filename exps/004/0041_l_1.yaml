# Fine-tuning config 
model_id: "openai/whisper-medium"
language: "en"
task: "transcribe"

train_sets:
  - name: "spgispeech_2"

train_dataset_args:
  max_audio_duration_secs: 30

val_sets:
  - name: "spgispeech_2"

val_dataset_args:
  max_audio_duration_secs: 30
  max_samples: -1

eval_sets:
  - name: "spgispeech_2"

eval_dataset_args:
  max_audio_duration_secs: 30
  max_samples: -1

# Data scaling
data_fractions: [0.2]
num_subsets: 2

# LoRA
lora_config:
  r: 64                  # Rank
  lora_alpha: 128        # Alpha scaling
  lora_dropout: 0.1     # Dropout probability
  init_blocks:
    - ["proj_out", "layers.23"]

target_modules:
- "proj_out"
- "model.decoder.layers.23.self_attn.q_proj"
- "model.decoder.layers.23.self_attn.k_proj"
- "model.decoder.layers.23.self_attn.v_proj"
- "model.decoder.layers.23.self_attn.out_proj"
- "model.decoder.layers.23.encoder_attn.q_proj"
- "model.decoder.layers.23.encoder_attn.k_proj"
- "model.decoder.layers.23.encoder_attn.v_proj"
- "model.decoder.layers.23.encoder_attn.out_proj"
- "model.decoder.layers.23.fc1"
- "model.decoder.layers.23.fc2"

# Training
output_dir: "outputs/spgispeech_2/004/0041/data_scaling"
num_epochs: 1
batch_size: 16
grad_accum_steps: 1
learning_rate: 1e-5
warmup_ratio: 0.01
fp16: true
data_seed: 42
dataloader_num_workers: 8
strict_reproducibility: true


max_steps_fraction: 1.0
log_dataset_metadata: true
# Evaluation
eval_steps: 1000
eval_batch_size: 16
