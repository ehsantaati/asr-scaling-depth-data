# Fine-tuning config 
model_id: "openai/whisper-medium"
language: "en"
task: "transcribe"

train_sets:
  - name: "spgispeech-s"

val_sets:
  - name: "spgispeech-s"

eval_sets:
  - name: "spgispeech-s"

# Data scaling
data_fractions: [1.0]
num_subsets: 1

# LoRA (optional, disable for this test)
lora_config:
  r: 8                  # Rank
  lora_alpha: 16        # Alpha scaling
  lora_dropout: 0.1     # Dropout probability

target_modules: # LoRA adapters are typically applied to Linear layers (like k_proj, fc1).
  - "proj_out" #  LayerNorm layers and bias vectors are usually not valid targets for LoRA itself.
  - "model.decoder.layers.11.self_attn.k_proj"
  - "model.decoder.layers.11.self_attn.v_proj"
  - "model.decoder.layers.11.self_attn.q_proj"
  - "model.decoder.layers.11.self_attn.out_proj"
  - "model.decoder.layers.11.fc1"
  - "model.decoder.layers.11.fc2"

# Training
output_dir: "outputs/004"
max_steps: 5000 
batch_size: 16
grad_accum_steps: 1
learning_rate: 1e-5
warmup_steps: 500
fp16: true
seed: 42

# Evaluation
do_eval: true
eval_steps: 1000
eval_batch_size: 32
