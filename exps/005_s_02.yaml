# Fine-tuning config 
model_id: "openai/whisper-medium"
language: "en"
task: "transcribe"

train_sets:
  - name: "spgispeech-s"

val_sets:
  - name: "spgispeech-s"

eval_sets:
  - name: "spgispeech-s"

# Data scaling
data_fractions: [0.2]
num_subsets: 5

target_modules:
  - "proj_out"
# Training
output_dir: "outputs/005"
max_steps: 5000 
batch_size: 16
grad_accum_steps: 1
learning_rate: 1e-5
warmup_steps: 500
fp16: true
seed: 42

# Evaluation
do_eval: true
eval_steps: 1000
eval_batch_size: 32
