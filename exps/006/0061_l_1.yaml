# Fine-tuning config 
model_id: "openai/whisper-medium"
language: "en"
task: "transcribe"

train_sets:
  - name: "speechcolab-gigaspeech-m"
    streaming: false

train_dataset_args:
  max_audio_duration_secs: 30

val_sets:
  - name: "speechcolab-gigaspeech-m"
    streaming: false

val_dataset_args:
  max_audio_duration_secs: 30
  max_samples: -1

eval_sets:
  - name: "speechcolab-gigaspeech-m"
    streaming: false

eval_dataset_args:
  max_audio_duration_secs: 30
  max_samples: -1

# Data scaling
data_fractions: [1.0]
num_subsets: 1

# LoRA
