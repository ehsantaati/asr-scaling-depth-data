# Fine-tuning config 
# Repeating exp 004 with higher lora rank and increasing the number of target modules to match experiment 003
model_id: "openai/whisper-medium"
language: "en"
task: "transcribe"

train_sets:
  - name: "spgispeech-s"

val_sets:
  - name: "spgispeech-s"

eval_sets:
  - name: "spgispeech-s"

# Data scaling
data_fractions: [1.0]
num_subsets: 1

# LoRA (optional disable for this test)
lora_config:
  r: 16                  # Rank
  lora_alpha: 32        # Alpha scaling
  lora_dropout: 0.1     # Dropout probability

target_modules: # LoRA adapters applied to all trainable paramters similar to experiment 003.
  - "proj_out"
  - "model.decoder.layers.11.self_attn.k_proj"
  - "model.decoder.layers.11.self_attn.v_proj"
  - "model.decoder.layers.11.self_attn.q_proj"
  - "model.decoder.layers.11.self_attn.out_proj"
  - "model.decoder.layers.11.fc1"
  - "model.decoder.layers.11.fc2"
# ValueError: Target module LayerNorm((1024,), eps=1e-05, elementwise_affine=True) is not supported.
# Currently, only the following modules are supported:
# `torch.nn.Linear`, `torch.nn.Embedding`, `torch.nn.Conv1d`, `torch.nn.Conv2d`, `torch.nn.Conv3d`, `transformers.pytorch_utils.Conv1D`, `torch.nn.MultiheadAttention.`.
# Training
output_dir: "outputs/006"
max_steps: 5000 
batch_size: 16
grad_accum_steps: 1
learning_rate: 1e-5
warmup_steps: 500
fp16: true
seed: 42

# Evaluation
do_eval: true
eval_steps: 1000
eval_batch_size: 32
