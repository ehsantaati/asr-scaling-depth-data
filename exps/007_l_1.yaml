# Fine-tuning config 
# Repeat 002_tr_l_1.yaml with r =32
model_id: "openai/whisper-medium"
language: "en"
task: "transcribe"

train_sets:
  - name: "spgispeech-s"

val_sets:
  - name: "spgispeech-s"

eval_sets:
  - name: "spgispeech-s"

# Data scaling
data_fractions: [1.0]
num_subsets: 1

# LoRA (optional, disable for this test)
lora_config:
  r: 32                  # Rank
  lora_alpha: 64        # Alpha scaling
  lora_dropout: 0.1     # Dropout probability

target_modules:
  - "proj_out"
# Training
output_dir: "outputs/007"
max_steps: 5000 
batch_size: 16
grad_accum_steps: 1
learning_rate: 1e-5
warmup_steps: 500
fp16: true
seed: 42

# Evaluation
do_eval: true
eval_steps: 1000
eval_batch_size: 32
