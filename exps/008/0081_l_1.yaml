# Training
output_dir: "outputs/spgispeech_2/008/0081"
num_epochs: 1
batch_size: 16
grad_accum_steps: 1
learning_rate: 1e-5
warmup_ratio: 0.01
fp16: true
data_seed: 42
dataloader_num_workers: 8
strict_reproducibility: true

# Evaluation
do_eval: true
eval_steps: 1000
eval_batch_size: 16
