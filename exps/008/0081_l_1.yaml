# Fine-tuning config 
model_id: "openai/whisper-medium"
language: "en"
task: "transcribe"

train_sets:
  - name: "spgispeech_2"

train_dataset_args:
  max_audio_duration_secs: 30

val_sets:
  - name: "spgispeech_2"

val_dataset_args:
  max_audio_duration_secs: 30
  max_samples: -1

eval_sets:
  - name: "spgispeech_2"

eval_dataset_args:
  max_audio_duration_secs: 30
  max_samples: -1

# Data scaling
data_fractions: [1.0]
num_subsets: 1

# LoRA
lora_config:
  r: 64                  # Rank
  lora_alpha: 128        # Alpha scaling
  lora_dropout: 0.1     # Dropout probability

target_modules:
  - "proj_out"
  - "model.decoder.embed_tokens"
  - "model.decoder.embed_positions"
  - "model.decoder.layers.23.self_attn"
  - "model.decoder.layers.23.encoder_attn"
  - "model.decoder.layers.23.fc"
